# Multi-game platform service (Super Seven + Super Four), deployed from the
# platform branch. Deliberately named differently from the live `super-seven`
# service so a Blueprint deploy creates a NEW service (super-cards.onrender.com)
# and never touches the production Super Seven deployment built from master.
services:
  - type: web
    name: super-cards
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python3 app.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FLASK_DEBUG
        value: "0"
      - key: PORT
        value: "10000"
