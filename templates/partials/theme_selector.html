<div class="theme-select-wrap" id="theme-select-wrap" style="display:none">
  <button class="theme-select-btn" id="theme-select-btn" title="Select Table Theme" aria-label="Select Table Theme">
    <span class="theme-icon" id="current-theme-icon">🎰</span>
    <span class="theme-name" id="current-theme-name">Casino Felt</span>
  </button>
  <div class="theme-dropdown" id="theme-dropdown" role="menu" aria-hidden="true" hidden>
    <button class="theme-opt" type="button" data-t="casino" title="Classic Emerald Green Casino felt">
      <span class="theme-opt-icon">🎰</span>
      <span class="theme-opt-label">Casino Felt</span>
    </button>
    <button class="theme-opt" type="button" data-t="marble" title="Luxury Marble felt">
      <span class="theme-opt-icon">🏛️</span>
      <span class="theme-opt-label">Marble Luxury</span>
    </button>
    <button class="theme-opt" type="button" data-t="red_casino" title="Royal Red Casino Felt">
      <span class="theme-opt-icon">🍒</span>
      <span class="theme-opt-label">Red Casino</span>
    </button>
    <button class="theme-opt" type="button" data-t="ocean_glow" title="Ocean Glow Night">
      <span class="theme-opt-icon">🌊</span>
      <span class="theme-opt-label">Ocean Glow</span>
    </button>
    <button class="theme-opt" type="button" data-t="sunset_mirage" title="Sunset Mirage">
      <span class="theme-opt-icon">🌅</span>
      <span class="theme-opt-label">Sunset Mirage</span>
    </button>
    <button class="theme-opt" type="button" data-t="poker" title="Padded wood-tone rail, rounded corners">
      <span class="theme-opt-icon">🃏</span>
      <span class="theme-opt-label">Poker Table</span>
    </button>
    <button class="theme-opt" type="button" data-t="royal" title="Gold filigree corners and a crown">
      <span class="theme-opt-icon">👑</span>
      <span class="theme-opt-label">Royal</span>
    </button>
    <button class="theme-opt" type="button" data-t="hacker" title="Neon HUD corners and a circuit grid">
      <span class="theme-opt-icon">🖥️</span>
      <span class="theme-opt-label">Hacker</span>
    </button>
    <button class="theme-opt" type="button" data-t="horror" title="Torn edges and bleeding cracks">
      <span class="theme-opt-icon">🩸</span>
      <span class="theme-opt-label">Horror</span>
    </button>
    <button class="theme-opt" type="button" data-t="pirate" title="Weathered wood rail, rope trim, skull plaque">
      <span class="theme-opt-icon">☠️</span>
      <span class="theme-opt-label">Pirate Treasure</span>
    </button>
    <button class="theme-opt" type="button" data-t="space" title="Deep-space gradient with a scattered starfield">
      <span class="theme-opt-icon">🌌</span>
      <span class="theme-opt-label">Space Galaxy</span>
    </button>
    <button class="theme-opt" type="button" data-t="egyptian" title="Sandstone and gold, ankh plaque, desert night sky">
      <span class="theme-opt-icon">🏺</span>
      <span class="theme-opt-label">Egyptian Pharaoh</span>
    </button>
    <button class="theme-opt" type="button" data-t="wildwest" title="Weathered leather and wood, sheriff-star plaque">
      <span class="theme-opt-icon">🤠</span>
      <span class="theme-opt-label">Wild West Saloon</span>
    </button>
    <button class="theme-opt" type="button" data-t="forest" title="Mystical greens, vine border, firefly glow">
      <span class="theme-opt-icon">🌲</span>
      <span class="theme-opt-label">Enchanted Forest</span>
    </button>
    <button class="theme-opt" type="button" data-t="imperial" title="Chinese lacquer red, gold dragons and a meander fret">
      <span class="theme-opt-icon">🐉</span>
      <span class="theme-opt-label">Imperial Dragon</span>
    </button>
    <button class="theme-opt" type="button" data-t="maharaja" title="Rajput court magenta, Mughal arcade and paisley corners">
      <span class="theme-opt-icon">🦚</span>
      <span class="theme-opt-label">Maharaja Durbar</span>
    </button>
    <button class="theme-opt" type="button" data-t="deco" title="Black lacquer and champagne gold, Art Deco sunbursts">
      <span class="theme-opt-icon">🥂</span>
      <span class="theme-opt-label">Gatsby Deco</span>
    </button>
  </div>
</div>
