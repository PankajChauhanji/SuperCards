<div class="theme-select-wrap" id="view-mode-wrap" style="display:none">
  <button class="theme-select-btn" id="view-mode-btn" title="Select Hand View" aria-label="Select Hand View">
    <span class="theme-icon" id="current-view-icon">🃏</span>
    <span class="theme-name" id="current-view-name">Standard view</span>
  </button>
  <div class="theme-dropdown" id="view-mode-dropdown" role="menu" aria-hidden="true" hidden>
    <button class="theme-opt" type="button" data-mode="standard" title="Fanned hand, held like real cards">
      <span class="theme-opt-icon">🃏</span>
      <span class="theme-opt-label">Standard view</span>
    </button>
    <button class="theme-opt" type="button" data-mode="box" title="Flat grid in a scrollable box — easier to tap for big hands">
      <span class="theme-opt-icon">🗃️</span>
      <span class="theme-opt-label">Box view</span>
    </button>
  </div>
</div>
