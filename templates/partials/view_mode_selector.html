{# Hand view — a section of the Settings sheet. Personal, per-device
   (core/view_mode.js). Hidden for games with a single hand layout. #}
<section class="set-sec" id="view-mode-wrap" hidden>
  <div class="set-sec-head">
    <h3 class="set-sec-title"><svg class="ico" aria-hidden="true"><use href="#i-fan"/></svg>Your hand</h3>
  </div>
  <div class="segmented" id="view-mode-dropdown" role="radiogroup" aria-label="Hand view">
    <button class="seg-opt" type="button" role="radio" data-mode="standard"><svg class="ico" aria-hidden="true"><use href="#i-fan"/></svg>Fanned</button>
    <button class="seg-opt" type="button" role="radio" data-mode="box"><svg class="ico" aria-hidden="true"><use href="#i-grid"/></svg>Grid</button>
  </div>
</section>
