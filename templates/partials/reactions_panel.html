<div class="reactions-layer" id="reactions-layer"></div>
<div class="reaction-dock" id="reaction-dock" style="display:none">
  <div class="reaction-panel" id="reaction-panel" hidden>
    <!-- Recently Used Section -->
    <div class="rx-recent-container" id="rx-recent-container" style="display:none">
      <div class="rx-recent-label">Recent</div>
      <div class="rx-recent-grid" id="rx-recent-grid"></div>
      <div class="rx-divider" id="rx-recent-divider"></div>
    </div>
    <!-- Combined Emojis Grid (prioritizing roasting/funny reactions) -->
    <div class="rx-grid" id="rx-main-grid">
      <button class="rx" data-e="🤡" title="Clown">🤡</button>
      <button class="rx" data-e="💀" title="Dead/RIP">💀</button>
      <button class="rx" data-e="🤫" title="Shh">🤫</button>
      <button class="rx" data-e="🥱" title="Boring">🥱</button>
      <button class="rx" data-e="💩" title="Poop">💩</button>
      <button class="rx" data-e="👶" title="Baby">👶</button>
      <button class="rx" data-e="🍿" title="Popcorn">🍿</button>
      <button class="rx" data-e="🐔" title="Chicken">🐔</button>
      <button class="rx" data-e="🦖" title="Dinosaur/Slow">🦖</button>
      <button class="rx" data-e="🤦" title="Facepalm">🤦</button>
      <button class="rx" data-e="🤥" title="Liar">🤥</button>
      <button class="rx" data-e="🐌" title="Snail">🐌</button>
      <button class="rx" data-e="🤏" title="Small">🤏</button>
      <button class="rx" data-e="🚮" title="Trash">🚮</button>
      <button class="rx" data-e="👎" title="Thumbs Down">👎</button>
      <button class="rx" data-e="😂" title="Laugh">😂</button>
      <button class="rx" data-e="🤯" title="Mind Blown">🤯</button>
      <button class="rx" data-e="🔥" title="Nice Move">🔥</button>
      <button class="rx" data-e="⚡" title="Speed Up">⚡</button>
      <button class="rx" data-e="🎉" title="Celebration">🎉</button>
      <button class="rx" data-e="😲" title="Surprise">😲</button>
      <button class="rx" data-e="😭" title="Cry">😭</button>
      <button class="rx" data-e="😡" title="Anger">😡</button>
      <button class="rx" data-e="👏" title="Good Game">👏</button>
      <button class="rx" data-e="😎" title="Smooth Move">😎</button>
    </div>
  </div>
  <button class="reaction-fab" id="reaction-fab" title="React" aria-label="Send a reaction">😀</button>
</div>
