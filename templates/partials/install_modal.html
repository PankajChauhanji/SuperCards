<div class="modal-backdrop" id="install-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Install Super Cards">
    <div class="dialog-head">
      <h2 id="install-title">Install Super Cards</h2>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" data-lang="en" class="install-lang-btn lang-btn active" aria-pressed="true">EN</button>
        <button type="button" data-lang="hi" class="install-lang-btn lang-btn" aria-pressed="false">हिं</button>
      </div>
    </div>

    <!-- Native one-tap install. core/install.js unhides this only when the
         browser actually offers a prompt (Chrome/Edge on Android + desktop). -->
    <div id="install-now-row" hidden>
      <button type="button" class="btn-primary" id="install-now-btn"><svg class="ico" aria-hidden="true"><use href="#i-download"/></svg>Install now</button>
      <p class="install-now-hint">One tap — no browser menus needed.</p>
    </div>

    <p id="install-done-note" hidden class="install-done-note">
      Super Cards is already installed on this device.
    </p>

    <p id="install-manual-intro" hidden class="install-manual-intro">
      Prefer to do it yourself? Here are the manual steps.
    </p>

    <div id="install-content-container"></div>

    <div class="close-row">
      <button class="btn-primary" id="install-close">Close</button>
    </div>
  </div>
</div>
