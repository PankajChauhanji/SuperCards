<div class="modal-backdrop" id="install-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Install Super Cards">
    <div class="rules-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;padding-bottom:0.5rem;border-bottom:1px solid rgba(255,255,255,0.1);gap:0.75rem;">
      <h2 style="margin:0;" id="install-title">📱 Install Super Cards</h2>
      <div class="lang-toggle" style="display:flex;gap:4px;background:rgba(255,255,255,0.06);padding:4px;border-radius:8px;">
        <button type="button" data-lang="en" class="install-lang-btn" style="border:none;background:#6706ce;color:white;padding:4px 12px;border-radius:6px;cursor:pointer;font-weight:700;font-size:0.85rem;">EN</button>
        <button type="button" data-lang="hi" class="install-lang-btn" style="border:none;background:transparent;color:inherit;padding:4px 12px;border-radius:6px;cursor:pointer;font-weight:700;font-size:0.85rem;">HI</button>
      </div>
    </div>

    <div id="install-content-container"></div>

    <div class="close-row">
      <button class="btn-primary" id="install-close">Close</button>
    </div>
  </div>
</div>
