{# Card deck — a section of the Settings sheet. A personal, per-device choice
   (core/deck.js): each option shows the same card from that deck, so the
   difference is visible rather than described. #}
<section class="set-sec" id="deck-select-wrap">
  <div class="set-sec-head">
    <h3 class="set-sec-title"><svg class="ico" aria-hidden="true"><use href="#i-layers"/></svg>Card deck</h3>
    <span class="set-sec-note">Only on your screen</span>
  </div>
  <div class="deck-choice" id="deck-dropdown" role="radiogroup" aria-label="Card deck">
    <button class="deck-opt" type="button" role="radio" data-deck="royal">
      <span class="deck-preview"><img src="{{ url_for('static', filename='img/cards_v2/KH.svg') }}" alt="" loading="lazy" data-deck-fixed /><img src="{{ url_for('static', filename='img/cards_v2/AS.svg') }}" alt="" loading="lazy" data-deck-fixed /></span>
      <span class="deck-opt-text"><strong>Royal</strong><small>Four-colour suits, illustrated courts</small></span>
    </button>
    <button class="deck-opt" type="button" role="radio" data-deck="standard">
      <span class="deck-preview"><img src="{{ url_for('static', filename='img/cards/KH.svg') }}" alt="" loading="lazy" data-deck-fixed /><img src="{{ url_for('static', filename='img/cards/AS.svg') }}" alt="" loading="lazy" data-deck-fixed /></span>
      <span class="deck-opt-text"><strong>Standard</strong><small>Classic two-colour deck</small></span>
    </button>
  </div>
</section>
