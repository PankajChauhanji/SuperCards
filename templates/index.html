<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Seven</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/lobby.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/table.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/reactions.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}" />
  <style>
    /* Game picker (landing page) — additive, self-contained. */
    .game-picker { margin-bottom: 1.25rem; }
    .picker-label { font-size: 0.85rem; opacity: 0.75; margin-bottom: 0.5rem; }
    .picker-tiles { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .game-tile {
      flex: 1 1 130px; min-width: 120px; display: flex; flex-direction: column;
      align-items: flex-start; gap: 0.25rem; padding: 0.75rem 0.9rem; cursor: pointer;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.04); color: inherit; text-align: left;
      transition: border-color 0.15s, background 0.15s, transform 0.05s;
    }
    .game-tile:hover:not(.disabled) { border-color: rgba(103,6,206,0.7); background: rgba(103,6,206,0.12); }
    .game-tile.selected { border-color: #6706ce; background: rgba(103,6,206,0.2); box-shadow: 0 0 0 1px #6706ce inset; }
    .game-tile .gt-name { font-weight: 600; font-size: 0.95rem; }
    .game-tile .gt-badge { font-size: 0.7rem; opacity: 0.7; }
    .game-tile.disabled { cursor: not-allowed; opacity: 0.5; }
  </style>
</head>
<body>
  <main class="home">
    <header>
      <div class="wordmark"><span class="wordmark-title">SUPER <span class="seven">SEVEN</span></span> <img src="{{ url_for('static', filename='img/super_seven_symbol.svg') }}" alt="Symbol" class="logo-inline-symbol" /></div>
      <p class="tagline">Dump your hand. Call it before they catch you.</p>
    </header>

    <section class="card-panel">
      <div class="game-picker" id="game-picker">
        <div class="picker-label">Choose a game</div>
        <div class="picker-tiles">
          {% for g in games %}
          {% if g.ready %}
          <button type="button" class="game-tile{% if loop.first %} selected{% endif %}" data-game="{{ g.key }}">
            <span class="gt-name">{{ g.display_name }}</span>
          </button>
          {% else %}
          <button type="button" class="game-tile disabled" disabled title="Coming soon">
            <span class="gt-name">{{ g.display_name }}</span>
            <span class="gt-badge">Coming soon</span>
          </button>
          {% endif %}
          {% endfor %}
        </div>
      </div>

      <div class="field">
        <label for="name">Your name</label>
        <input type="text" id="name" maxlength="20" autocomplete="off" placeholder="e.g. Riya" />
      </div>

      <button class="btn-primary" id="create-btn">Create a room</button>
      <button class="btn-solo" id="solo-btn">Play with Computer</button>

      <div class="game-settings" id="settings-section" data-game="super_seven">
      <button class="settings-toggle" id="settings-toggle" type="button">Game settings ▸</button>
      <div class="settings-grid hidden" id="settings-grid">
        <div>
          <label for="set_max_score">Max score (out)</label>
          <input type="number" id="set_max_score" value="100" min="20" max="1000" />
        </div>
        <div>
          <label for="set_stop_penalty">Stop penalty</label>
          <input type="number" id="set_stop_penalty" value="40" min="0" max="200" />
        </div>
        <div>
          <label for="set_win_discount">Win discount</label>
          <input type="number" id="set_win_discount" value="5" min="0" max="50" />
        </div>
        <div>
          <label for="set_turn_timer">Turn timer (s)</label>
          <input type="number" id="set_turn_timer" value="40" min="15" max="180" />
        </div>
        <div>
          <label for="set_timeout_limit">Timeouts allowed</label>
          <input type="number" id="set_timeout_limit" value="3" min="1" max="10" />
        </div>
        <div>
          <label for="set_num_decks">Number of decks</label>
          <input type="number" id="set_num_decks" value="1" min="1" max="10" />
        </div>
      </div>
      </div><!-- /#settings-section -->
    </section>

    <p class="divider">or join one</p>

    <section class="card-panel">
      <div class="field">
        <label for="code">Room code</label>
        <input type="text" id="code" class="code-input" maxlength="4" autocomplete="off" placeholder="ABCD" />
      </div>
      <button class="btn-ghost" id="join-btn">Join room</button>
    </section>
  </main>

  <footer class="site-footer compact">
    <div class="footer-links">
      <a href="https://github.com/PankajChauhanji/SuperSevenCards" target="_blank" rel="noreferrer">GitHub</a>
      <a href="mailto:pankajchauhan.nitsri@gmail.com">Email</a>
      <a href="https://www.linkedin.com/in/pankaj-chauhan-sde/" target="_blank" rel="noreferrer">LinkedIn</a>
    </div>
    <p class="footer-star">Enjoyed the game? <a href="https://github.com/PankajChauhanji/SuperSevenCards" target="_blank" rel="noreferrer">Leave a ⭐ on GitHub</a> — it keeps the project alive.</p>
  </footer>

  <div id="toast"></div>

  <script src="{{ url_for('static', filename='js/vendor/socket.io.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/core/identity.js') }}"></script>
  <script src="{{ url_for('static', filename='js/core/socket.js') }}"></script>
  <script src="{{ url_for('static', filename='js/home.js') }}"></script>
</body>
</html>
