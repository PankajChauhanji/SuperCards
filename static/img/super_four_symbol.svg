<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100%" height="100%">
  <defs>
    <clipPath id="s4-card-clip">
      <rect x="5" y="5" width="90" height="130" rx="14" />
    </clipPath>
    <!-- Top half: Super 4 green accent -->
    <linearGradient id="s4-top-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ff0a6" />
      <stop offset="100%" stop-color="#1f9e5f" />
    </linearGradient>
    <linearGradient id="s4-bottom-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="s4-gold-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe66d" />
      <stop offset="50%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#d48a00" />
    </linearGradient>
  </defs>

  <g clip-path="url(#s4-card-clip)">
    <rect x="5" y="5" width="90" height="65" fill="url(#s4-top-grad)" />
    <rect x="5" y="70" width="90" height="65" fill="url(#s4-bottom-grad)" />
    <g opacity="0.08" stroke="#ffffff" stroke-width="2">
      <line x1="-20" y1="20" x2="120" y2="160" />
      <line x1="0" y1="0" x2="120" y2="120" />
      <line x1="20" y1="-20" x2="120" y2="80" />
      <line x1="-40" y1="40" x2="80" y2="160" />
    </g>
  </g>

  <rect x="5" y="5" width="90" height="130" rx="14" fill="none" stroke="url(#s4-gold-grad)" stroke-width="3.5" opacity="0.8" />

  <!-- Bold 4 -->
  <text x="50" y="99" text-anchor="middle" font-family="'Space Grotesk', 'Arial Black', sans-serif"
        font-weight="700" font-size="80" fill="url(#s4-gold-grad)"
        filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))">4</text>
</svg>
