<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100%" height="100%">
  <defs>
    <clipPath id="pk-card-clip">
      <rect x="5" y="5" width="90" height="130" rx="14" />
    </clipPath>
    <!-- Top half: Poker teal accent -->
    <linearGradient id="pk-top-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fe3d3" />
      <stop offset="100%" stop-color="#1f8f7f" />
    </linearGradient>
    <linearGradient id="pk-bottom-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pk-gold-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe66d" />
      <stop offset="50%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#d48a00" />
    </linearGradient>
  </defs>

  <g clip-path="url(#pk-card-clip)">
    <rect x="5" y="5" width="90" height="65" fill="url(#pk-top-grad)" />
    <rect x="5" y="70" width="90" height="65" fill="url(#pk-bottom-grad)" />
    <g opacity="0.08" stroke="#ffffff" stroke-width="2">
      <line x1="-20" y1="20" x2="120" y2="160" />
      <line x1="0" y1="0" x2="120" y2="120" />
      <line x1="20" y1="-20" x2="120" y2="80" />
      <line x1="-40" y1="40" x2="80" y2="160" />
    </g>
  </g>

  <rect x="5" y="5" width="90" height="130" rx="14" fill="none" stroke="url(#pk-gold-grad)" stroke-width="3.5" opacity="0.8" />

  <!-- Gold spade, drawn as geometry rather than a font glyph so it renders the
       same on every device (see todos §15). -->
  <path d="M50 34 C62 50 80 60 80 76 C80 89 67 96 56 87 C57 97 61 104 67 108 L33 108 C39 104 43 97 44 87 C33 96 20 89 20 76 C20 60 38 50 50 34 Z"
        fill="url(#pk-gold-grad)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))" />
</svg>
