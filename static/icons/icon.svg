<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3d35"/>
      <stop offset="100%" stop-color="#0f1f1c"/>
    </linearGradient>
    <linearGradient id="card-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e5b"/>
      <stop offset="100%" stop-color="#9b0022"/>
    </linearGradient>
    <linearGradient id="card-bot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe66d"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#d48a00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="card-clip">
      <rect x="166" y="110" width="180" height="252" rx="20"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="18" y="18" width="476" height="476" rx="82" fill="url(#bg-grad)"/>

  <!-- Subtle radial glow behind card -->
  <circle cx="256" cy="256" r="188" fill="#e6b23c" opacity="0.06"/>

  <!-- Playing card -->
  <g clip-path="url(#card-clip)">
    <rect x="166" y="112" width="180" height="124" fill="url(#card-top)"/>
    <rect x="166" y="236" width="180" height="124" fill="url(#card-bot)"/>
    <!-- Subtle diagonal lines -->
    <g opacity="0.06" stroke="#ffffff" stroke-width="3">
      <line x1="120" y1="140" x2="400" y2="420"/>
      <line x1="160" y1="100" x2="400" y2="340"/>
      <line x1="200" y1="60" x2="400" y2="260"/>
      <line x1="80" y1="180" x2="360" y2="460"/>
    </g>
  </g>

  <!-- Card border (gold) -->
  <rect x="166" y="112" width="180" height="248" rx="20" fill="none"
        stroke="url(#gold)" stroke-width="4" opacity="0.7"/>

  <!-- Jester hat (centered on card) -->
  <g fill="url(#gold)" filter="url(#glow)"
     transform="translate(256, 242) scale(3.1) translate(-50, -36)">
    <path d="M 50,42 Q 42,28 26,38 Q 35,46 41,50 Q 45,35 50,22 Q 55,35 59,50
             Q 65,46 74,38 Q 58,28 50,42 Z"/>
    <circle cx="26" cy="38" r="3.5"/>
    <circle cx="50" cy="21" r="3.5"/>
    <circle cx="74" cy="38" r="3.5"/>
  </g>

  <!-- "SC" text at bottom -->
  <text x="256" y="418" text-anchor="middle" font-family="system-ui, sans-serif"
        font-weight="700" font-size="36" fill="url(#gold)" opacity="0.5"
        letter-spacing="8">SC</text>
</svg>
