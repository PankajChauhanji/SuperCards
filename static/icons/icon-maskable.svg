<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3d35"/>
      <stop offset="100%" stop-color="#0f1f1c"/>
    </linearGradient>
    <linearGradient id="mcard-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e5b"/>
      <stop offset="100%" stop-color="#9b0022"/>
    </linearGradient>
    <linearGradient id="mcard-bot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mgold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe66d"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#d48a00"/>
    </linearGradient>
    <filter id="mglow">
      <feGaussianBlur stdDeviation="9.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="mcard-clip">
      <rect x="141.1" y="71.8" width="229.9" height="297.8" rx="23.5"/>
    </clipPath>
  </defs>

  <!-- FULL BLEED: 0,0 to 512,512, zero gap. This is what Android needs
       to mask cleanly. The rx here only affects flat/unmasked previews. -->
  <rect x="20" y="20" width="472" height="472" rx="42" fill="url(#mbg)"/>

  <circle cx="254" cy="242" r="208.6" fill="#e6b23c" opacity="0.06"/>

  <g clip-path="url(#mcard-clip)">
    <rect x="141.1" y="71.8" width="229.9" height="128" fill="url(#mcard-top)"/>
    <rect x="141.1" y="199.9" width="229.9" height="169.8" fill="url(#mcard-bot)"/>
    <g opacity="0.06" stroke="#ffffff" stroke-width="3.9">
      <line x1="81" y1="117.6" x2="431" y2="467.6"/>
      <line x1="141.1" y1="58.8" x2="431" y2="348.7"/>
      <line x1="20.9" y1="177.6" x2="360.5" y2="517.2"/>
    </g>
  </g>

  <rect x="141.1" y="71.8" width="229.9" height="297.8" rx="23.5" fill="none"
        stroke="url(#mgold)" stroke-width="5.2" opacity="0.7"/>

  <g fill="url(#mgold)" filter="url(#mglow)"
     transform="translate(256, 232.5) scale(3.79) translate(-50, -36)">
    <path d="M 50,42 Q 42,28 26,38 Q 35,46 41,50 Q 45,35 50,22 Q 55,35 59,50
             Q 65,46 74,38 Q 58,28 50,42 Z"/>
    <circle cx="26" cy="38" r="3.5"/>
    <circle cx="50" cy="21" r="3.5"/>
    <circle cx="74" cy="38" r="3.5"/>
  </g>

  <text x="256" y="431" text-anchor="middle" font-family="system-ui, sans-serif"
        font-weight="700" font-size="44.4" fill="url(#mgold)" opacity="0.6"
        letter-spacing="9.1">SC</text>
</svg>