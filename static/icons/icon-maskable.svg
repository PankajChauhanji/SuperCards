<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="sc-card-clip">
      <rect x="16" y="16" width="480" height="480" rx="125"/>
    </clipPath>
    <linearGradient id="sc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3d35"/>
      <stop offset="100%" stop-color="#0f1f1c"/>
    </linearGradient>
    <linearGradient id="sc-top-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e5b"/>
      <stop offset="100%" stop-color="#9b0022"/>
    </linearGradient>
    <linearGradient id="sc-bottom-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sc-gold-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe66d"/>
      <stop offset="50%" stop-color="#ffc300"/>
      <!-- <stop offset="100%" stop-color="#d48a00"/> -->
    </linearGradient>
  </defs>

  <!-- Full-bleed base for real Android masking. Card covers ~93% of this,
       so only a thin sliver peeks at the corners — same idea you wanted. -->
  <!-- <rect x="0" y="0" width="512" height="512" fill="url(#sc-bg)"/> -->

  <g clip-path="url(#sc-card-clip)">
    <rect x="16" y="16" width="480" height="240" fill="url(#sc-top-grad)"/>
    <rect x="16" y="256" width="480" height="240" fill="url(#sc-bottom-grad)"/>
    <g opacity="0.08" stroke="#ffffff" stroke-width="4">
      <line x1="-60" y1="80" x2="500" y2="640"/>
      <line x1="20" y1="0" x2="540" y2="520"/>
      <line x1="80" y1="-80" x2="540" y2="380"/>
      <line x1="-140" y1="180" x2="380" y2="700"/>
    </g>
  </g>

  <!-- Gold jester hat — circles now land well inside the wider card -->
  <g fill="url(#sc-gold-grad)" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.5))"
     transform="translate(256,271) scale(6.4) translate(-50,-36)">
    <path d="M 50,42 Q 42,28 26,38 Q 35,46 41,50 Q 45,35 50,22 Q 55,35 59,50 Q 65,46 74,38 Q 58,28 50,42 Z"/>
    <circle cx="26" cy="38" r="3.5"/>
    <circle cx="50" cy="21" r="4"/>
    <circle cx="74" cy="38" r="3.5"/>
  </g>


  <text x="270" y="405" text-anchor="middle" font-family="system-ui, sans-serif"
        font-weight="1000" font-size="52" fill="url(#sc-gold-grad)" opacity="1"
        letter-spacing="2">Super Cards</text>
</svg>